<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:">
<title>PDF Studio</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;font:500 13px/1.4 "Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-app-region:drag}
body{display:grid;place-items:center;padding:20px}
#card{position:relative;width:520px;height:320px;border-radius:24px;overflow:hidden;color:#eceaff;
  background:radial-gradient(120% 90% at 18% 10%,#2d2670 0%,#1a1640 45%,#110f2b 100%);
  box-shadow:0 24px 60px -12px rgba(8,6,30,.65),0 0 0 1px rgba(160,145,255,.18) inset;
  animation:in .55s cubic-bezier(.2,.8,.2,1) both}
html.leaving #card{animation:out .4s cubic-bezier(.4,0,1,1) forwards}
@keyframes in{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:scale(1.03) translateY(-6px)}}
.grid{position:absolute;inset:0;background-image:radial-gradient(rgba(170,155,255,.14) 1px,transparent 1.3px);background-size:22px 22px;
  -webkit-mask-image:radial-gradient(70% 70% at 30% 40%,#000,transparent);mask-image:radial-gradient(70% 70% at 30% 40%,#000,transparent)}
.glow{position:absolute;left:-60px;top:-40px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(130,108,255,.45),transparent 65%);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.12);opacity:.75}}
.main{position:absolute;left:36px;right:36px;top:44px;height:150px;display:flex;align-items:center;gap:30px}
svg.emblem{flex:none;width:130px;height:130px;overflow:visible;animation:float 5s ease-in-out 1.9s infinite}
@keyframes float{50%{transform:translateY(-5px)}}
.sheet{transform-box:fill-box;transform-origin:50% 90%;opacity:0}
.s1{animation:s1 1.3s cubic-bezier(.3,1.2,.4,1) .15s forwards}
.s2{animation:s2 1.3s cubic-bezier(.3,1.2,.4,1) .3s forwards}
.s3{animation:s3 1.3s cubic-bezier(.3,1.2,.4,1) .45s forwards}
@keyframes s1{0%{opacity:0;transform:translate(-46px,10px) rotate(-34deg)}35%{opacity:1;transform:translate(-26px,0) rotate(-20deg)}100%{opacity:.5;transform:translate(-5px,3px) rotate(-5deg)}}
@keyframes s2{0%{opacity:0;transform:translate(46px,10px) rotate(34deg)}35%{opacity:1;transform:translate(26px,0) rotate(20deg)}100%{opacity:.75;transform:translate(5px,1px) rotate(4deg)}}
@keyframes s3{0%{opacity:0;transform:translateY(40px) scale(.9)}100%{opacity:1;transform:none}}
.line{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .6s ease-out forwards}
.l1{animation-delay:1.25s}.l2{animation-delay:1.4s}.l3{animation-delay:1.55s}
@keyframes draw{to{stroke-dashoffset:0}}
.scan{animation:scan 1.1s ease-in-out 1.05s both}
@keyframes scan{0%{transform:translateY(-4px);opacity:0}15%,85%{opacity:1}100%{transform:translateY(112px);opacity:0}}
.fold{opacity:0;animation:fade .4s ease-out 1.5s forwards}
@keyframes fade{to{opacity:1}}
.txt{min-width:0}
.name{font:800 34px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:-.03em;white-space:nowrap;clip-path:inset(0 100% 0 0);animation:wipe .9s cubic-bezier(.6,0,.2,1) 1.0s forwards}
.name span{background:linear-gradient(90deg,#b7a8ff,#7c6bff);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
.tag{margin-top:12px;color:#aaa4d8;letter-spacing:.14em;font-size:10.5px;text-transform:uppercase;opacity:0;animation:fade .6s ease-out 1.6s forwards}
.priv{margin-top:8px;color:#7f79b3;font-size:11.5px;opacity:0;animation:fade .6s ease-out 1.85s forwards}
.foot{position:absolute;left:36px;right:36px;bottom:30px}
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg{position:relative;height:4px;border-radius:4px;background:rgba(170,155,255,.18);overflow:hidden}
.seg::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,#8f7dff,#c1b6ff);transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.3,.9,.3,1)}
html[data-step="1"] .seg:nth-child(-n+1)::after,html[data-step="2"] .seg:nth-child(-n+2)::after,
html[data-step="3"] .seg:nth-child(-n+3)::after,html[data-step="4"] .seg::after{transform:scaleX(1)}
html[data-step="1"] .seg:nth-child(1)::after,html[data-step="2"] .seg:nth-child(2)::after,html[data-step="3"] .seg:nth-child(3)::after{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.meta{display:flex;justify-content:space-between;margin-top:12px;font-size:11.5px;color:#aaa4d8}
#status{color:#eceaff}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition:none!important}}
</style>
</head>
<body>
<div id="card">
  <div class="grid"></div><div class="glow"></div>
  <div class="main">
    <svg class="emblem" viewBox="0 0 120 120" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a86ff"/><stop offset="1" stop-color="#5a49d6"/></linearGradient>
        <linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9d2ff" stop-opacity="0"/><stop offset=".5" stop-color="#e9e4ff"/><stop offset="1" stop-color="#d9d2ff" stop-opacity="0"/></linearGradient>
        <clipPath id="c"><rect x="26" y="8" width="68" height="94" rx="10"/></clipPath>
      </defs>
      <rect class="sheet s1" x="26" y="8" width="68" height="94" rx="10" fill="#6d5cf0"/>
      <rect class="sheet s2" x="26" y="8" width="68" height="94" rx="10" fill="#8a79ff"/>
      <g class="sheet s3">
        <rect x="26" y="8" width="68" height="94" rx="10" fill="url(#g)"/>
        <path class="fold" d="M72 8h12a10 10 0 0 1 10 10v12H82a10 10 0 0 1-10-10z" fill="#fff" opacity=".28"/>
        <g stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none">
          <path class="line l1" d="M40 52h40"/><path class="line l2" d="M40 67h40"/><path class="line l3" d="M40 82h24"/>
        </g>
        <g clip-path="url(#c)"><rect class="scan" x="22" y="6" width="76" height="12" fill="url(#b)"/></g>
      </g>
    </svg>
    <div class="txt">
      <div class="name">PDF <span>Studio</span></div>
      <div class="tag">Merge · Reorder · Edit · Convert</div>
      <div class="priv">Local-first. Your documents stay on this device.</div>
    </div>
  </div>
  <div class="foot">
    <div class="segs"><i class="seg"></i><i class="seg"></i><i class="seg"></i><i class="seg"></i></div>
    <div class="meta"><span id="status">Securing workspace</span><span id="ver"></span></div>
  </div>
</div>
</body>
</html>
