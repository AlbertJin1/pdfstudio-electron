<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5147d0" />
    <link rel="icon" type="image/svg+xml" href="./icons/pdf-studio.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/pdf-studio-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/pdf-studio-180.png" />
    <meta name="description" content="PDF Studio — a modern local-first PDF workspace." />
    <title>PDF Studio</title>
    <script>
      // Pick the splash colours before first paint, following the stored mode or OS preference.
      try {
        const saved = JSON.parse(localStorage.getItem('pdfstudio-settings') || '{}');
        const hasVersionedThemeMode = saved.themeModeVersion === 1 && ['system', 'light', 'dark'].includes(saved.theme);
        // Older releases stored only the resolved light/dark appearance. Start those installs in System mode.
        const mode = hasVersionedThemeMode ? saved.theme : 'system';
        const systemDark = !!window.matchMedia?.('(prefers-color-scheme: dark)').matches;
        if (mode === 'dark' || (mode === 'system' && systemDark)) document.documentElement.setAttribute('data-boot', 'dark');
      } catch (_) {}
    </script>
    <style>
      /* Static splash: pure HTML/CSS so it paints on the very first frame, long before the JS bundle has loaded. */
      html, body { margin: 0; height: 100%; background: #f6f7fb; }
      html[data-boot="dark"], html[data-boot="dark"] body { background: #18191f; }
      #boot-splash { position: fixed; inset: 0; z-index: 2147483000; display: grid; place-content: center; justify-items: center; gap: 18px; background: #f6f7fb; color: #20223a; font: 600 15px/1 "Segoe UI", system-ui, sans-serif; -webkit-app-region: drag; user-select: none; }
      html[data-boot="dark"] #boot-splash { background: #18191f; color: #e6e7ef; }
      #boot-splash .mark { width: 60px; height: 60px; display: grid; place-items: center; border-radius: 17px; background: linear-gradient(145deg, #7a63f0, #4f46c9); box-shadow: 0 10px 30px -8px rgb(91 78 214 / .55); }
      #boot-splash .itrs-mark { position: absolute; top: 22px; right: 24px; width: 67px; opacity: 0; transform: translateY(-5px) scale(.9); animation: boot-itrs-in .7s cubic-bezier(.2,.8,.2,1) .2s forwards, boot-itrs-glow 3.6s ease-in-out 1s infinite; }
      #boot-splash .itrs-mark img { display: block; width: 100%; height: auto; }
      #boot-splash .itrs-mark .itrs-white { display: none; }
      html[data-boot="dark"] #boot-splash .itrs-mark .itrs-dark { display: none; }
      html[data-boot="dark"] #boot-splash .itrs-mark .itrs-white { display: block; }
      @keyframes boot-itrs-in { to { opacity: .94; transform: none; } }
      @keyframes boot-itrs-glow { 50% { filter: drop-shadow(0 0 7px rgb(126 103 255 / .35)); } }
      #boot-splash b { font-weight: 800; letter-spacing: -.01em; font-size: 17px; }
      #boot-splash b span { color: #6f5bea; }
      html[data-boot="dark"] #boot-splash b span { color: #a89aff; }
      #boot-splash .bar { position: relative; width: 120px; height: 3px; overflow: hidden; border-radius: 3px; background: rgb(111 91 234 / .18); }
      #boot-splash .bar::after { content: ''; position: absolute; inset: 0; width: 40%; border-radius: inherit; background: #6f5bea; animation: boot-slide 1.1s ease-in-out infinite; }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
      @media (prefers-reduced-motion: reduce) { #boot-splash .bar::after { animation: none; width: 100%; opacity: .5; } #boot-splash .itrs-mark { animation: none; opacity: .9; transform: none; } }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="itrs-mark"><img class="itrs-dark" src="./branding/itrs-dark.png" alt="" draggable="false"><img class="itrs-white" src="./branding/itrs-white.png" alt="" draggable="false"></div>
      <div class="mark"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg></div>
      <b>PDF<span>Studio</span></b>
      <div class="bar"></div>
    </div>
    <div id="root"></div>
    <script>
      // If the renderer bundle fails to load or React never mounts, show a useful
      // diagnostic instead of leaving the user with an unhelpful blank window.
      (() => {
        let dismissed = false;
        const hasUi = () => {
          const root = document.getElementById('root');
          return Boolean(root && root.childElementCount > 0);
        };
        const showStartupError = (detail) => {
          if (dismissed || hasUi()) return;
          let panel = document.getElementById('pdfstudio-startup-error');
          if (!panel) {
            panel = document.createElement('section');
            panel.id = 'pdfstudio-startup-error';
            panel.style.cssText = 'position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;padding:28px;background:#f5f6fb;color:#20223a;font:15px/1.55 Segoe UI,Arial,sans-serif;';
            panel.innerHTML = '<div style="width:min(720px,100%);padding:clamp(24px,5vw,42px);border:1px solid #e1e4ef;border-radius:22px;background:white;box-shadow:0 20px 70px #28305b14"><div style="font-size:12px;font-weight:800;letter-spacing:.16em;color:#765df5">PDF STUDIO · STARTUP CHECK</div><h1 style="font-size:30px;letter-spacing:-.03em;margin:22px 0 8px">The interface did not start</h1><p style="color:#606982">The app could not load its frontend. Close this window and run the following commands from the project folder.</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f7fb;border:1px solid #e4e7f0;border-radius:12px;padding:14px;color:#4a526c;font:13px/1.5 Consolas,monospace">npm install\nnpm start</pre><p style="color:#606982">If the problem continues, run <code>npm run check</code> and read the first build error in the terminal.</p><button id="pdfstudio-startup-reload" style="border:0;border-radius:10px;padding:11px 16px;background:#765df5;color:white;font-weight:700;cursor:pointer">Try reloading</button><pre id="pdfstudio-startup-detail" style="display:none;white-space:pre-wrap;overflow-wrap:anywhere;color:#8a4560;font:12px/1.5 Consolas,monospace;margin-top:18px"></pre></div>';
            panel.querySelector('#pdfstudio-startup-reload').addEventListener('click', () => window.location.reload());
            document.body.appendChild(panel);
          }
          const details = panel.querySelector('#pdfstudio-startup-detail');
          if (detail && details) { details.textContent = String(detail); details.style.display = 'block'; }
          // Tell Electron to replace the splash with its native diagnostic screen. Without this
          // bridge, the HTML error panel can remain hidden behind the separate splash window.
          try {
            const bridge = window.pdfStudio;
            if (typeof bridge?.reportStartupError === 'function') {
              Promise.resolve(bridge.reportStartupError({
                heading: 'The interface did not start',
                message: 'PDF Studio could not finish loading its interface.',
                details: String(detail || 'A renderer startup error occurred.').slice(0, 3000),
              })).catch(() => {});
            }
          } catch (_) {}
        };
        const watchdog = window.setTimeout(() => showStartupError('The React interface did not render within 18 seconds.'), 18000);
        window.addEventListener('error', (event) => {
          if (!hasUi()) showStartupError(event.message || 'A script or resource failed to load.');
        });
        window.addEventListener('unhandledrejection', (event) => {
          if (!hasUi()) showStartupError(event.reason?.message || String(event.reason || 'An unhandled startup promise failed.'));
        });
        window.__PDF_STUDIO_BOOT_SUCCESS = () => {
          window.clearTimeout(watchdog);
          dismissed = true;
          document.getElementById('pdfstudio-startup-error')?.remove();
          document.getElementById('boot-splash')?.remove();
        };
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Compatibility layer for older prebuilt renderer bundles; the current React title bar owns its tabs. -->
    <script type="module" src="/editor-tabs-compat.js"></script>
  </body>
</html>
